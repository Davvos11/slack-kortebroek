apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace, its RBAC and the slack-kortebroek-env Secret are managed by infra-tg (Terragrunt).
namespace: slack-kortebroek

resources:
  - cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/name: slack-kortebroek

# The deploy job sets newTag to the commit SHA (kustomize edit set image).
images:
  - name: app
    newName: ghcr.io/davvos11/slack-kortebroek
    newTag: latest
