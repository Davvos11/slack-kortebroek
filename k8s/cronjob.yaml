apiVersion: batch/v1
kind: CronJob
metadata:
  name: slack-kortebroek
spec:
  schedule: "15 7 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: app # replaced by kustomize
              envFrom:
                - secretRef:
                    name: slack-kortebroek-env
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
